<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./bootstrap/css/bootstrap.css">   
    <link rel="stylesheet" href="./style.css">  
    <title>Game</title>
</head>
 
<body>
<header>

    <h1>Guess My Number ! </h1>
    <button class="Between show-modal " style="background-color: inherit; color: #eee; border: none;"> * Hint * </button>
    <button class="btn again"> Again!</button>
    <div class="number">?</div>
</header>
    <div class="Modaal hidden" >
        <button class="close-modal">&times;</button>
        <p style="font-size: 12px;">
            Try to guess my number ! Choose a number from 1 to 20 and enter it in the box.
        </p>

    </div>
    <div class="overlay hidden"></div>
<main>
    <section class="left">
        <input  class="guess" type="number">
        <button class="btn check">check</button>
    </section class="right">
    <section class="right">
        <p class="message">Start guessing...</p>
        <p class="score">💯Score:<span>20</span></p>
        <p class="Highscore">🥇HighScore:<span>0</span></p>
    </section>
</main>







    <script src="script.js"></script>
</body>

</html>
